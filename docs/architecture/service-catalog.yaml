version: 1
services:
  esp8266-firmware:
    type: device
    path: apps/Esp8266
    status: existing
    runtime: embedded
    language: cpp
    hardware:
      board: nodemcuv2
      microcontroller: ESP8266
    responsibilities:
      - connect the NodeMCU device to Wi-Fi
      - accept firmware updates over ArduinoOTA
      - indicate device activity with the built-in LED
    exposes:
      - name: arduino-ota
        protocol: udp
        port: 8266
    depends_on: []
    used_by: []
    data:
      stores: []
    operations:
      documentation: apps/Esp32/ESP_FEATURE_MAP.md
      build: pio run
      monitor: pio device monitor --baud 115200

  esp32-camera:
    type: device
    path: apps/esp32-camera
    status: existing
    runtime: embedded
    language: cpp
    hardware:
      board: AI Thinker ESP32-CAM
      microcontroller: ESP32
    responsibilities:
      - initialize the camera and validate a local JPEG capture
      - connect the device to Wi-Fi
      - accept password-protected firmware updates over ArduinoOTA
    exposes:
      - name: arduino-ota
        protocol: tcp
        port: 3232
    depends_on: []
    used_by: []
    data:
      stores: []
    operations:
      documentation: apps/esp32-camera/ESP_FEATURE_MAP.md
      build: pio run
      monitor: pio device monitor --baud 115200

  telegram-gateway:
    type: application
    path: apps/telegram-gateway
    status: planned
    runtime: node
    language: typescript
    responsibilities:
      - receive and normalize Telegram updates
      - authorize users and groups
      - deliver messages for internal services
    exposes:
      - name: telegram-webhook
        path: /telegram/webhook
        protocol: https
      - name: internal-message-adapter
        path: /internal/messages
        protocol: http
    contract: docs/contracts/telegram-gateway-v1.md
    depends_on:
      - postgres
      - traefik
    used_by:
      - iot-water-quality
    data:
      stores:
        - telegram_events
        - message_deliveries
    operations:
      healthcheck: /health
      readiness: /ready
      runbook: docs/runbooks/telegram-gateway.md

  iot-water-quality:
    type: application
    status: planned
    runtime: TBD
    responsibilities:
      - collect water-quality measurements
      - validate and analyze measurements
      - request Telegram alerts through the gateway contract
    depends_on:
      - telegram-gateway

  postgres:
    type: platform
    status: existing
    responsibilities:
      - shared relational persistence

  traefik:
    type: platform
    status: existing
    responsibilities:
      - ingress and TLS routing
